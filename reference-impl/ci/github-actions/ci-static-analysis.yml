# Static-analysis CI gate
# Pillar IX.2 / IX.4 in the whitepaper.
# NOT official Salesforce documentation.

name: Salesforce Static Analysis

on:
  pull_request:
    paths:
      - 'reference-impl/force-app/**'
      - 'reference-impl/ci/**'
      - '.github/workflows/ci-static-analysis.yml'
  push:
    branches: [main]
    paths:
      - 'reference-impl/force-app/**'

jobs:
  static-analysis:
    name: PMD + Salesforce Code Analyzer
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      # Salesforce Code Analyzer v5 replaces the retired @salesforce/sfdx-scanner
      # plugin (v4 retired August 2025). Topic: `sf code-analyzer run`.
      - name: Install Salesforce Code Analyzer plugin
        run: sf plugins install @salesforce/plugin-code-analyzer

      - name: Run Code Analyzer (Apex + LWC)
        working-directory: reference-impl
        run: |
          sf code-analyzer run \
            --workspace force-app \
            --rule-selector "Recommended;Security;BestPractices;Performance" \
            --config-file ci/code-analyzer-config.yml \
            --view detail \
            --output-file scanner-results.json \
            --severity-threshold 3 || EXIT=$?
          exit ${EXIT:-0}

      - name: Upload scanner results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-results
          path: reference-impl/scanner-results.*
          if-no-files-found: ignore
